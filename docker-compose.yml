services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-myuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      DB_NAME: ${POSTGRES_DB:-alarm}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-alarm}
      POSTGRES_USER: ${POSTGRES_USER:-myuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-myuser} -d ${POSTGRES_DB:-alarm}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Toolchain container: docker compose run --rm go <command>.
  # Add --no-deps to skip starting postgres.
  go:
    profiles: ["tools"]
    image: golang:1.27
    working_dir: /app
    entrypoint: ["go"]
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-myuser}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-mypassword}
      DB_NAME: ${POSTGRES_DB:-alarm}
      DB_SSLMODE: ${DB_SSLMODE:-disable}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - gomodcache:/go/pkg/mod
      - gobuildcache:/root/.cache/go-build

volumes:
  pgdata:
  gomodcache:
  gobuildcache:
